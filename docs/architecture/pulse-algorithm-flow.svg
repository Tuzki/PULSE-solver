<rect x="190" y="1308" width="26" height="18" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.0"/>
<text x="226" y="1322" font-size="10.2" fill="#475569" text-anchor="start" font-weight="400">补充 / 修正节点</text>
<rect x="360" y="1308" width="26" height="18" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.0"/>
<text x="396" y="1322" font-size="10.2" fill="#475569" text-anchor="start" font-weight="400">判定</text>
<rect x="470" y="1308" width="26" height="18" rx="4" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.0"/>
<text x="506" y="1322" font-size="10.2" fill="#475569" text-anchor="start" font-weight="400">起点 / 终点</text>
<text x="58" y="1346" font-size="9.8" fill="#64748b" text-anchor="start" font-weight="400">关键约束：先取证后传播；候选整体提交或整体回滚；输出只观察已提交状态。</text>
</svg>