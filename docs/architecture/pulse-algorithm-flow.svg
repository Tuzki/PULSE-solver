<line x1="210" y1="247" x2="318.8" y2="247.0" stroke="#94a3b8" stroke-width="1.8"/>
<polygon points="326.0,247 318.69528847750155,250.26208362447656 318.69528847750155,243.73791637552344" fill="#94a3b8"/>
<rect x="150" y="640" width="120" height="26" rx="13.0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="210.0" y="656.78" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">t ← t1</text>
<text x="150" y="690" font-size="9.4" fill="#64748b" text-anchor="start" font-weight="400">进入</text>
<text x="150" y="704" font-size="9.4" fill="#64748b" text-anchor="start" font-weight="400">下一轮</text>
<text x="975" y="1000" font-size="10.5" fill="#c2410c" text-anchor="start" font-weight="700">注意</text>
<text x="975" y="1018" font-size="9.6" fill="#64748b" text-anchor="start" font-weight="400">“不变”不是终点：</text>
<text x="975" y="1034" font-size="9.6" fill="#64748b" text-anchor="start" font-weight="400">时间仍前进，</text>
<text x="975" y="1050" font-size="9.6" fill="#64748b" text-anchor="start" font-weight="400">只是模态保持不变。</text>
<rect x="40" y="1290" width="1200" height="72" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="58" y="1308" width="26" height="18" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
